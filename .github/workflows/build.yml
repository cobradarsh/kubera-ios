name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - tools/**
      - Tweak/**
      - .github/workflows/tweak.yml
      - shots/**

jobs:
  build:
    # Intel: the Apple-chip macOS runners often wait 15+ minutes or are never assigned (seen 2026-11-26).
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun swiftc --version

      - name: Logic tests (parser, categoriser, ledger, holidays, screenshot reader, mail parsers)
        run: bash tests/run.sh

      - name: Build
        run: bash build.sh

      - name: Verify
        run: |
          APP=build/Payload/Kubera.app
          xcrun lipo -info "$APP/Kubera"
          xcrun otool -l "$APP/Kubera" | grep -A5 LC_BUILD_VERSION | head -6
          xcrun otool -L "$APP/Kubera"
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|AppIcon|MinimumOSVersion|CFBundleShortVersionString|BGTask' || true
          codesign -d --entitlements - --xml "$APP/Kubera" | plutil -p - || true
          codesign --verify --deep --verbose "$APP"
          ls -la "$APP"
          du -sh "$APP" "$APP/Kubera"
          shasum -a 256 build/Kubera.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Kubera
          path: build/Kubera.ipa
          if-no-files-found: error
